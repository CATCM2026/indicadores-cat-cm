<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard de Indicadores — CAT CM </title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
 tr.row-catcm {
  position: sticky;
  top: 38px; /* ajuste fino se necessário */
  z-index: 5;
  background: #E6F1FB; /* cor sólida (IMPORTANTE) */
  font-weight: 600;
  border-left: 4px solid #3266AD;
}
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #F7F6F2; --surface: #FFFFFF; --surface2: #F0EEE9;
    --border: rgba(0,0,0,0.10); --border-med: rgba(0,0,0,0.18);
    --text: #1A1916; --text2: #5F5E5A; --text3: #888780;
    --green: #1D9E75; --green-bg: #E1F5EE; --green-text: #0F6E56;
    --red: #E24B4A; --red-bg: #FCEBEB; --red-text: #A32D2D;
    --amber: #BA7517; --amber-bg: #FAEEDA;
    --accent: #3266AD; --accent-bg: #E6F1FB;
    --radius: 8px; --radius-lg: 12px; --radius-xl: 16px;
  }
  body { font-family: 'DM Sans', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; line-height: 1.5; }
  .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 2rem; display: flex; align-items: center; justify-content: space-between; height: 60px; position: sticky; top: 0; z-index: 100; }
  .header-logo { display: flex; align-items: center; gap: 10px; }
  .logo-dot { width: 28px; height: 28px; background: var(--text); border-radius: 7px; display: flex; align-items: center; justify-content: center; }
  .logo-dot span { color: #fff; font-size: 13px; font-weight: 600; }
  .header h1 { font-size: 15px; font-weight: 600; color: var(--text); letter-spacing: -0.3px; }
  .header-right { display: flex; align-items: center; gap: 8px; }
  .header-date { font-size: 12px; color: var(--text3); font-family: 'DM Mono', monospace; }
  .main { max-width: 1400px; margin: 0 auto; padding: 2rem; }
  .controls-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 1.5rem; flex-wrap: wrap; }
  .page-title { font-size: 22px; font-weight: 600; letter-spacing: -0.5px; color: var(--text); }
  .page-subtitle { font-size: 13px; color: var(--text3); margin-top: 2px; }
  .ctrl-group { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  input[type="text"], select { font-family: 'DM Sans', sans-serif; font-size: 13px; padding: 7px 12px; border-radius: var(--radius); border: 1px solid var(--border-med); background: var(--surface); color: var(--text); outline: none; transition: border-color 0.15s; }
  input[type="text"]:focus, select:focus { border-color: var(--accent); }
  input[type="text"] { width: 200px; }
  .btn-group { display: flex; border: 1px solid var(--border-med); border-radius: var(--radius); overflow: hidden; }
  .btn-group button { padding: 7px 16px; font-size: 12px; font-family: 'DM Sans', sans-serif; font-weight: 500; background: var(--surface); color: var(--text2); border: none; cursor: pointer; transition: background 0.15s, color 0.15s; }
  .btn-group button + button { border-left: 1px solid var(--border); }
  .btn-group button.active { background: var(--text); color: #fff; }
  .summary-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin-bottom: 1.5rem; }
  .sum-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 14px 16px; position: relative; overflow: hidden; }
  .sum-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; }
  .sum-card.ok::before { background: var(--green); }
  .sum-card.nok::before { background: var(--red); }
  .sum-card.warn::before { background: var(--amber); }
  .sum-ind { font-size: 11px; font-weight: 600; letter-spacing: 0.5px; color: var(--text2); text-transform: uppercase; margin-bottom: 6px; }
  .sum-val { font-size: 20px; font-weight: 600; font-family: 'DM Mono', monospace; letter-spacing: -1px; margin-bottom: 4px; }
  .sum-val.ok { color: var(--green); } .sum-val.nok { color: var(--red); } .sum-val.warn { color: var(--amber); }
  .sum-meta { font-size: 11px; color: var(--text3); }
  .sum-badge { display: inline-block; font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 20px; margin-top: 6px; }
  .sum-badge.ok { background: var(--green-bg); color: var(--green-text); }
  .sum-badge.nok { background: var(--red-bg); color: var(--red-text); }
  .sum-badge.warn { background: var(--amber-bg); color: var(--amber); }
  .month-tabs { display: flex; gap: 4px; margin-bottom: 1.25rem; overflow-x: auto; padding-bottom: 2px; }
  .month-tab { padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border-med); font-size: 12px; font-weight: 500; cursor: pointer; white-space: nowrap; background: var(--surface); color: var(--text2); transition: all 0.15s; }
  .month-tab:hover { border-color: var(--text2); }
  .month-tab.active { background: var(--text); color: #fff; border-color: var(--text); }
  .table-section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-xl); overflow: hidden; }
  .table-header-bar { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .table-header-bar span { font-size: 13px; color: var(--text3); }
  .table-wrap { overflow-x: auto; max-height: 600px; overflow-y: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; min-width: 820px; }
  thead { position: sticky; top: 0; z-index: 10; }
  thead tr:first-child th { background: var(--surface2); color: var(--text2); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; padding: 12px 10px; border-bottom: 1px solid var(--border); text-align: center; white-space: nowrap; }
  thead tr:first-child th.unit-col { text-align: left; min-width: 130px; }
  thead tr.meta-row th { background: var(--surface); font-size: 11px; font-weight: 500; color: var(--text3); font-family: 'DM Mono', monospace; padding: 6px 10px; border-bottom: 2px solid var(--border-med); text-align: center; }
  thead tr.meta-row th.unit-col { text-align: left; font-family: 'DM Sans', sans-serif; color: var(--text3); }
  tbody tr { border-bottom: 1px solid var(--border); transition: background 0.1s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--bg); }
  td { padding: 9px 10px; text-align: center; font-family: 'DM Mono', monospace; font-size: 12px; white-space: nowrap; }
  td.unit-col { text-align: left; font-family: 'DM Sans', sans-serif; font-weight: 500; font-size: 13px; color: var(--text); }
  td.unit-num { color: var(--text3); font-size: 11px; text-align: center; font-family: 'DM Mono', monospace; }
  .cell-ok { color: var(--green); font-weight: 500; } .cell-warn { color: var(--amber); font-weight: 500; } .cell-nok { color: var(--red); font-weight: 500; }
  .badge { display: inline-block; font-size: 10px; font-weight: 600; padding: 3px 9px; border-radius: 20px; font-family: 'DM Sans', sans-serif; letter-spacing: 0.3px; }
  .badge-ok { background: var(--green-bg); color: var(--green-text); }
  .badge-nok { background: var(--red-bg); color: var(--red-text); }
  .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .chart-grid.single-ind { grid-template-columns: 1fr; }
  .chart-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px; overflow: hidden; }
  .chart-box.single-ind { display: grid; grid-template-columns: 280px 1fr; gap: 0 24px; align-items: start; }
  .chart-box.single-ind .chart-box-header { grid-column: 1 / -1; }
  .chart-box.single-ind .bar-list { columns: 2; column-gap: 24px; }
  .chart-box.single-ind .bar-row { break-inside: avoid; }
  .chart-box-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; }
  .chart-box-title { font-size: 14px; font-weight: 600; color: var(--text); }
  .chart-box-sub { font-size: 12px; color: var(--text3); }
  .bar-list { display: flex; flex-direction: column; gap: 5px; }
  .bar-row { display: flex; align-items: center; gap: 8px; }
  .bar-label { font-size: 11px; color: var(--text2); width: 100px; text-align: right; flex-shrink: 0; font-family: 'DM Mono', monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .single-ind .bar-label { width: 130px; text-align: left; }
  .bar-track { flex: 1; height: 14px; background: var(--surface2); border-radius: 3px; position: relative; overflow: visible; }
  .bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s ease; }
  .bar-fill.ok { background: #5DCAA5; } .bar-fill.warn { background: #F5C842; } .bar-fill.nok { background: #F09595; }
  .bar-meta-line { position: absolute; top: -3px; width: 2px; height: 20px; background: #3266AD; opacity: 0.6; border-radius: 1px; }
  .bar-val { font-size: 11px; font-family: 'DM Mono', monospace; font-weight: 500; width: 46px; flex-shrink: 0; }
  .bar-val.ok { color: var(--green); } .bar-val.warn { color: var(--amber); } .bar-val.nok { color: var(--red); }
  .trend-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .trend-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px; }
  .trend-canvas-wrap { position: relative; width: 100%; height: 180px; }
  .footer { text-align: center; font-size: 11px; color: var(--text3); padding: 2rem 0 1rem; font-family: 'DM Mono', monospace; }
  .empty-state { text-align: center; padding: 3rem 1rem; color: var(--text3); font-size: 13px; }
  .export-btn { padding: 7px 14px; border-radius: var(--radius); border: 1px solid var(--border-med); background: var(--surface); color: var(--text2); font-size: 12px; font-family: 'DM Sans', sans-serif; font-weight: 500; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; gap: 6px; }
  .export-btn:hover { background: var(--text); color: #fff; border-color: var(--text); }
  .ind-tabs { display: flex; gap: 6px; margin-bottom: 1.25rem; flex-wrap: wrap; align-items: center; }
  .ind-tab { padding: 6px 14px; border-radius: 20px; border: 1.5px solid var(--border-med); font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; background: var(--surface); color: var(--text2); transition: all 0.15s; letter-spacing: 0.3px; }
  .ind-tab:hover { border-color: var(--text2); color: var(--text); }
  .ind-tab.active { background: var(--text); color: #fff; border-color: var(--text); }
  .month-tab.acum-tab { border-style: dashed; font-style: italic; }
  .month-tab.acum-tab.active { background: var(--accent); border-color: var(--accent); font-style: italic; }
  td.col-highlight, th.col-highlight { background: rgba(50,102,173,0.07) !important; }
  td.col-dim, th.col-dim { opacity: 0.35; }

  /* Unit mode banner */
  .unit-banner { display: none; align-items: center; gap: 10px; background: var(--accent-bg); border: 1px solid rgba(50,102,173,0.25); border-radius: var(--radius-lg); padding: 10px 16px; margin-bottom: 1.25rem; }
  .unit-banner.visible { display: flex; }
  .unit-banner-label { font-size: 13px; font-weight: 600; color: var(--accent); flex: 1; }
  .unit-banner-sub { font-size: 12px; color: var(--text3); }
  .unit-banner-close { padding: 4px 10px; border-radius: var(--radius); border: 1px solid rgba(50,102,173,0.3); background: transparent; color: var(--accent); font-size: 12px; font-family: 'DM Sans', sans-serif; font-weight: 500; cursor: pointer; }
  .unit-banner-close:hover { background: var(--accent); color: #fff; }

  /* Unit select row */
  .unit-select-row { display: flex; align-items: center; gap: 8px; margin-bottom: 1.25rem; }
  .unit-select-label { font-size: 12px; color: var(--text3); white-space: nowrap; }
  #unitSelect { max-width: 280px; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .anim { animation: fadeIn 0.25s ease both; }
  @media (max-width: 900px) {
    .summary-grid { grid-template-columns: repeat(3, 1fr); }
    .chart-grid, .trend-grid { grid-template-columns: 1fr; }
    .main { padding: 1rem; }
    .header { padding: 0 1rem; }
  }
  @media (max-width: 560px) { .summary-grid { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<header class="header">
  <div class="header-logo">
    <div class="logo-dot"><span>IN</span></div>
    <h1>Indicadores &middot; CAT CM</h1>
  </div>
  <div class="header-right">
    <span class="header-date" id="headerDate"></span>
    <button class="export-btn" onclick="exportCSV()">&#8595; Exportar CSV</button>
  </div>
</header>

<main class="main">
 
<div id="executivePanel" style="
  background:#ffffff;
  border:1px solid rgba(0,0,0,0.1);
  border-radius:14px;
  padding:18px;
  margin-bottom:16px;">
</div>
  <div class="controls-row">
    <div>
      <div class="page-title">Comparativo Mensal</div>
      <div class="page-subtitle" id="pageSubtitle">Indicadores Operacionais 2026</div>
    </div>
    <div class="ctrl-group">
      <input type="text" id="searchBox" placeholder="&#128269; Buscar unidade..." oninput="applyFilters()" />
      <select id="filterSel" onchange="applyFilters()">
        <option value="all">Todas as unidades</option>
        <option value="nok">Com pendência</option>
        <option value="ok">Conforme</option>
      </select>
      <div class="btn-group">
        <button id="btnTable" class="active" onclick="switchView('table', this)">Tabela</button>
        <button id="btnChart" onclick="switchView('chart', this)">Barras</button>
        <button id="btnTrend" onclick="switchView('trend', this)">Tendência</button>
      </div>
    </div>
  </div>

  <!-- UNIT SELECT ROW -->
  <div class="unit-select-row">
    <span class="unit-select-label">&#128269; Unidade:</span>
    <select id="unitSelect" onchange="onUnitSelect()">
      <option value="">— Todas as unidades —</option>
    </select>
  </div>

  <!-- UNIT MODE BANNER -->
  <div class="unit-banner" id="unitBanner">
    <span class="unit-banner-label" id="unitBannerLabel"></span>
    <span class="unit-banner-sub">Exibindo todos os meses disponíveis para esta unidade</span>
    <button class="unit-banner-close" onclick="clearUnit()">&#10005; Limpar seleção</button>
  </div>

  <!-- MONTH TABS (oculto no modo unidade) -->
  <div class="month-tabs" id="monthTabs"></div>

  <!-- INDICATOR FILTER TABS -->
  <div class="ind-tabs" id="indTabs"></div>

  <!-- SUMMARY CARDS -->
  <div class="summary-grid" id="summaryGrid"></div>

  <!-- TABLE VIEW -->
  <div id="tableView">
    <div class="table-section">
      <div class="table-header-bar">
        <span id="tableCount"></span>
        <span id="tableMonth" style="font-size:12px;font-weight:500;color:var(--text2);"></span>
      </div>
      <div class="table-wrap">
        <table id="mainTable">
          <thead>
            <tr id="theadRow"></tr>
            <tr class="meta-row" id="metaRow"></tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- CHART VIEW -->
  <div id="chartView" style="display:none;">
    <div class="chart-grid" id="chartGrid"></div>
  </div>

  <!-- TREND VIEW -->
  <div id="trendView" style="display:none;">
    <div class="trend-grid" id="trendGrid"></div>
  </div>
</main>

<div class="footer"> Indicadores CAT CM </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const INDICATORS = [
  { key: 'DECA',  meta: 99.60, red: 97.00 },
  { key: 'DDIA',  meta: 98.40, red: 95.00 },
  { key: 'DBEI',  meta: 99.00, red: 97.00 },
  { key: 'AFHP',  meta: 95.00, red: 88.00 },
  { key: 'DOAT',  meta: 99.30, red: 97.00 },
  { key: 'TAPON', meta: 90.00, red: 88.00 },
];
const MONTHS = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const UNITS = [
  'AC ARARUNA','AC BARBOSA FERRAZ','AC BOA ESPERANCA','AC CAMPO MOURAO','AC CIANORTE',
  'AC CORUMBATAI DO SUL','AC ENGENHEIRO BELTRAO','AC FAROL','AC FENIX','AC GOIOERE',
  'AC INDIANOPOLIS','AC IRETAMA','AC JANIOPOLIS','AC JAPURA','AC JURANDA',
  'AC JUSSARA','AC LUIZIANA','AC MAMBORE','AC MARILUZ','AC MATO RICO',
  'AC MOREIRA SALES','AC NOVA TEBAS','AC PEABIRU','AC QUARTO CENTENARIO','AC QUINTA DO SOL',
  'AC RANCHO ALEGRE DO OESTE','AC RONCADOR','AC SAO TOME','AC TAPEJARA','AC TERRA BOA',
  'AC TUNEIRAS DO OESTE','AGF CAPITAL DO VESTUARIO','AGF PRACA PIO XII','AGF SANTA CRUZ',
  'LCF CIDADE CANCAO','CAT CM'
];

const DATA = {};
UNITS.forEach(u => { DATA[u] = {}; MONTHS.forEach(m => { DATA[u][m] = {}; INDICATORS.forEach(ind => { DATA[u][m][ind.key] = null; }); }); });
const IND_KEYS = INDICATORS.map(i => i.key);
function load(month, rows) {
  Object.entries(rows).forEach(([u, vals]) => {
    if (!DATA[u]) return;
    vals.forEach((v, i) => { DATA[u][month][IND_KEYS[i]] = v; });
  });
}

async function loadFromSheets() {
  const url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vScBG44esUCGPrXB358733CwG4sBLiOLC-UujJ3LFdqHIh4DdPiPfmPA2Lxs_28D0Ypn3DFk4xr73pd/pub?output=csv";

  const res = await fetch(url);
  const text = await res.text();

  const rows = text.split("\n").slice(1);

  rows.forEach(row => {
    const cols = row.split(",");

    const unidade = cols[0];
    const mes = cols[1];

    if (!DATA[unidade]) return;
    if (!DATA[unidade][mes]) return;

    INDICATORS.forEach((ind, i) => {
      const val = cols[i + 2];
      const num = parseFloat(val);
      DATA[unidade][mes][ind.key] = isNaN(num) ? null : num;
    });
  });

  applyFilters();
}

/* ── STATE ── */
let currentMonth = 'Mai';
let currentView = 'table';
let currentIndicator = 'all';
let selectedUnit = '';
let trendCharts = {};
let currentSort = 'az';
let sortColumn = null;
let sortDirections = {}; 

document.getElementById('headerDate').textContent = new Date().toLocaleDateString('pt-BR', { day:'2-digit', month:'short', year:'numeric' });

/* ── POPULATE UNIT SELECT ── */
function populateUnitSelect() {
  const sel = document.getElementById('unitSelect');
  UNITS.forEach(u => {
    const opt = document.createElement('option');
    opt.value = u; opt.textContent = u;
    sel.appendChild(opt);
  });
}

function onUnitSelect() {
  selectedUnit = document.getElementById('unitSelect').value;
  if (selectedUnit) {
    document.getElementById('unitBanner').classList.add('visible');
    document.getElementById('unitBannerLabel').textContent = '📍 ' + selectedUnit;
    document.getElementById('monthTabs').style.display = 'none';
    document.getElementById('filterSel').style.display = 'none';
    document.getElementById('searchBox').style.display = 'none';
  } else {
    clearUnit();
    return;
  }
  applyFilters();
}

function clearUnit() {
  selectedUnit = '';
  document.getElementById('unitSelect').value = '';
  document.getElementById('unitBanner').classList.remove('visible');
  document.getElementById('monthTabs').style.display = 'flex';
  document.getElementById('filterSel').style.display = '';
  document.getElementById('searchBox').style.display = '';
  applyFilters();
}

/* ── HELPERS ── */
function getAccum(u, indKey) {
  const vals = MONTHS.map(m => DATA[u][m][indKey]).filter(v => v !== null);
  if (!vals.length) return null;
  return parseFloat((vals.reduce((a,b) => a+b, 0) / vals.length).toFixed(2));
}
function getMonthData(u, month, indKey) {
  if (month === 'ACUM') return getAccum(u, indKey);
  return DATA[u][month][indKey];
}

/* ── MONTH TABS ── */
function buildMonthTabs() {
  const wrap = document.getElementById('monthTabs');
  const activeMths = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const monthBtns = activeMths.map(m =>
    `<button class="month-tab${m===currentMonth?' active':''}" onclick="selectMonth('${m}',this)">${m}</button>`
  ).join('');
  const acumBtn = `<button class="month-tab acum-tab${currentMonth==='ACUM'?' active':''}" onclick="selectMonth('ACUM',this)">&#8709; Acumulado</button>`;
  wrap.innerHTML = monthBtns + acumBtn;
}
function selectMonth(m, el) {
  currentMonth = m;
  document.querySelectorAll('.month-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  applyFilters();
}

/* ── IND TABS ── */
function buildIndTabs() {
  const wrap = document.getElementById('indTabs');
  const allBtn = `<button class="ind-tab all-tab${currentIndicator==='all'?' active':''}" onclick="selectIndicator('all',this)">Todos</button>`;
  const indBtns = INDICATORS.map(ind =>
    `<button class="ind-tab${currentIndicator===ind.key?' active':''}" onclick="selectIndicator('${ind.key}',this)">${ind.key}</button>`
  ).join('');
  wrap.innerHTML = allBtn + indBtns;
}
function selectIndicator(key, el) {
  currentIndicator = key;
  document.querySelectorAll('.ind-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  applyFilters();
}

/* ══════════════════════════════════════
   UNIT MODE — todos os meses em colunas
   ══════════════════════════════════════ */
function buildUnitSummary(u) {
  const grid = document.getElementById('summaryGrid');
  const indsToShow = currentIndicator === 'all' ? INDICATORS : INDICATORS.filter(i => i.key === currentIndicator);
  grid.innerHTML = indsToShow.map(ind => {
    const vals = MONTHS.map(m => DATA[u][m][ind.key]).filter(v => v !== null);
    if (!vals.length) {
      return `<div class="sum-card warn"><div class="sum-ind">${ind.key}</div><div class="sum-val warn">—</div><div class="sum-meta">Meta: ${ind.meta.toFixed(2)}%</div><div class="sum-badge warn">Sem dados</div></div>`;
    }
    const avg = vals.reduce((a,b)=>a+b,0)/vals.length;
    const cls = avg >= ind.meta ? 'ok' : avg <= ind.red ? 'nok' : 'warn';
    const nokMths = MONTHS.filter(m => { const v = DATA[u][m][ind.key]; return v !== null && v < ind.meta; }).length;
    return `<div class="sum-card ${cls}">
      <div class="sum-ind">${ind.key}</div>
      <div class="sum-val ${cls}">${avg.toFixed(2)}%</div>
      <div class="sum-meta">Média · Meta: ${ind.meta.toFixed(2)}%</div>
      <div class="sum-badge ${cls}">${nokMths > 0 ? nokMths + ' mês(es) abaixo' : 'Todos conformes'}</div>
    </div>`;
  }).join('');
  // pad to fill 6 cols if needed
  const shown = indsToShow.length;
  if (shown < 6) {
    grid.innerHTML += Array(6-shown).fill('<div></div>').join('');
  }
}

/* ── CHART: UNIT MODE (barras por mês) ── */
function buildUnitCharts(u) {
  const grid = document.getElementById('chartGrid');
  const indsToShow = currentIndicator === 'all' ? INDICATORS : INDICATORS.filter(i => i.key === currentIndicator);
  const isSingle = currentIndicator !== 'all';
  grid.className = 'chart-grid' + (isSingle ? ' single-ind' : '');

  grid.innerHTML = indsToShow.map(ind => {
    const monthVals = MONTHS.map(m => ({ m, v: DATA[u][m][ind.key] }));
    const nums = monthVals.map(x => x.v).filter(v => v !== null);
    if (!nums.length) return `<div class="chart-box anim"><div class="chart-box-header"><span class="chart-box-title">${ind.key}</span></div><p style="color:var(--text3);font-size:12px;">Sem dados</p></div>`;
    const min = Math.min(...nums); const max = Math.max(...nums);
    const range = Math.max(max - min, 0.01);
    const metaPct = ((ind.meta - min) / range) * 100;
    const bars = monthVals.map(({m, v}) => {
      if (v === null) return `<div class="bar-row"><span class="bar-label">${m}</span><div class="bar-track"><div class="bar-fill nok" style="width:2%"></div><div class="bar-meta-line" style="left:${Math.min(metaPct,98).toFixed(1)}%"></div></div><span class="bar-val" style="color:var(--text3)">—</span></div>`;
      const ok = v >= ind.meta; const bad = v <= ind.red;
      const barCls = ok ? 'ok' : bad ? 'nok' : 'warn';
      const pct = ((v - min) / range) * 100;
      return `<div class="bar-row"><span class="bar-label">${m}</span><div class="bar-track"><div class="bar-fill ${barCls}" style="width:${pct.toFixed(1)}%"></div><div class="bar-meta-line" style="left:${Math.min(metaPct,98).toFixed(1)}%"></div></div><span class="bar-val ${ok?'ok':bad?'nok':'warn'}">${v.toFixed(2)}%</span></div>`;
    }).join('');
    const nokCount = monthVals.filter(({v}) => v !== null && v < ind.meta).length;
    return `<div class="chart-box anim${isSingle?' single-ind':''}">
      <div class="chart-box-header">
        <span class="chart-box-title">${ind.key}</span>
        <span class="chart-box-sub" style="color:${nokCount>0?'var(--red)':'var(--green)'}">
          ${nokCount > 0 ? nokCount + ' mês(es) abaixo da meta' : 'Todos os meses conformes'} · meta ${ind.meta}%
        </span>
      </div>
      <div class="bar-list">${bars}</div>
    </div>`;
  }).join('');
}

function buildCharts(month, filter, search) {

    if (filter === 'ok') units = units.filter(u => { const v = getMonthData(u, month, ind.key); return v !== null && v >= ind.meta; });

    const range = Math.max(max - min, 0.01);

    const nok = units.filter(u => { const v = getMonthData(u, month, ind.key); return v === null || v < ind.meta; }).length;
    const displayed = isSingle ? units : units.slice(0, 18);
    const extra = !isSingle && units.length > 18 ? `<div style="font-size:11px;color:var(--text3);margin-top:8px;text-align:center;">+ ${units.length-18} unidades — selecione o indicador para ver todas</div>` : '';
    const bars = displayed.map(u => {

      const ok = v >= ind.meta; const bad = v <= ind.red;

      const pct = ((v - min) / range) * 100;
      return `<div class="bar-row"><span class="bar-label" title="${u}">${shortName}</span><div class="bar-track"><div class="bar-fill ${barCls}" style="width:${pct.toFixed(1)}%"></div><div class="bar-meta-line" style="left:${Math.min(metaPct,98).toFixed(1)}%"></div></div><span class="bar-val ${ok?'ok':bad?'nok':'warn'}">${v.toFixed(2)}%</span></div>`;

  }).join('');

      if (filter === 'ok') units = units.filter(u => MONTHS.every(m => DATA[u][m][ind.key] >= ind.meta));
      const avgData = MONTHS.map(m => { const v = DATA['CAT CM'][m][ind.key]; return v !== null ? parseFloat(v.toFixed(2)) : null; });
      const nums = avgData.filter(v => v !== null);
      if (!nums.length) return;
      const minV = Math.min(...nums) - 1; const maxV = Math.max(...nums) + 0.5;
      const canvas = document.getElementById(`trendCanvas${ii}`);
      if (!canvas) return;
      trendCharts[ii] = new Chart(canvas, {
        type: 'line',
        data: {
          labels: MONTHS,
          datasets: [
            { label: 'CAT CM', data: avgData, borderColor: '#3266AD', backgroundColor: 'rgba(50,102,173,0.08)', borderWidth: 2, pointRadius: 4, pointBackgroundColor: avgData.map(v => v !== null && v >= ind.meta ? '#1D9E75' : '#E24B4A'), pointBorderWidth: 0, fill: true, tension: 0.3 },
            { label: 'Meta', data: MONTHS.map(() => ind.meta), borderColor: '#E24B4A', borderWidth: 1.5, borderDash: [5,4], pointRadius: 0, fill: false }
          ]
        },
        options: {
          responsive: true, maintainAspectRatio: false, animation: { duration: 500 },
          plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => `${ctx.dataset.label}: ${ctx.parsed.y !== null ? ctx.parsed.y.toFixed(2)+'%' : '—'}` } } },
          scales: {
            x: { grid: { color: 'rgba(0,0,0,0.05)' }, ticks: { font: { size: 11 }, color: '#888780' } },
            y: { min: minV, max: maxV, grid: { color: 'rgba(0,0,0,0.05)' }, ticks: { font: { size: 11, family: "'DM Mono', monospace" }, color: '#888780', callback: v => v.toFixed(1)+'%' } }
          }
        }
      });
    });
  }, 50);
}

/* ── SWITCH VIEW ── */
function switchView(view, btn) {
  currentView = view;
  document.querySelectorAll('.btn-group button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tableView').style.display = view === 'table' ? 'block' : 'none';
  document.getElementById('chartView').style.display = view === 'chart' ? 'block' : 'none';
  document.getElementById('trendView').style.display = view === 'trend' ? 'block' : 'none';
  applyFilters();
}

/* ── APPLY FILTERS ── */
function applyFilters() {
 
if (!selectedUnit) {
  buildExecutivePanel(currentMonth);
} else {
  document.getElementById('executivePanel').innerHTML = '';
}

  const filter = document.getElementById('filterSel').value;
  const search = document.getElementById('searchBox').value.toLowerCase();

  if (selectedUnit) {
    // UNIT MODE
    buildUnitSummary(selectedUnit);
    if (currentView === 'table') { buildHeader(); buildUnitTable(selectedUnit); }
    else if (currentView === 'chart') buildUnitCharts(selectedUnit);
    else buildUnitTrend(selectedUnit);
  } else {
    // NORMAL MODE
    buildSummary(currentMonth);
    buildHeader();
    if (currentView === 'table') buildTable(currentMonth, filter, search);
    else if (currentView === 'chart') buildCharts(currentMonth, filter, search);
    else buildTrend(filter, search);
  }
}

/* ── EXPORT CSV ── */
function exportCSV() {
  if (selectedUnit) {
    const u = selectedUnit;
    const header = ['Mês', ...INDICATORS.map(i => i.key), 'Status'].join(';');
    const metas = ['Meta', ...INDICATORS.map(i => i.meta.toFixed(2)+'%'), ''].join(';');
    const body = MONTHS.map(m => {
      const vals = INDICATORS.map(ind => DATA[u][m][ind.key]);
      const allOk = vals.every((v,i) => v !== null && v >= INDICATORS[i].meta);
      const hasDado = vals.some(v => v !== null);
      return [m+' 2026', ...vals.map(v => v !== null ? v.toFixed(2)+'%' : '—'), hasDado ? (allOk ? '✅' : '⛔') : '—'].join(';');
    }).join('\n');
    const csv = `Unidade: ${u}\n${header}\n${metas}\n${body}`;
    const blob = new Blob(['\uFEFF'+csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `indicadores_${u.replace(/ /g,'_').toLowerCase()}.csv`;
    a.click(); URL.revokeObjectURL(url);
    return;
  }
  const filter = document.getElementById('filterSel').value;
  const search = document.getElementById('searchBox').value.toLowerCase();
  let rows = UNITS.filter(u => u.toLowerCase().includes(search));
  rows = rows.map(u => ({ u, vals: INDICATORS.map(ind => DATA[u][currentMonth][ind.key]), allOk: INDICATORS.every(ind => DATA[u][currentMonth][ind.key] >= ind.meta) }));
  if (filter === 'nok') rows = rows.filter(r => !r.allOk);
  if (filter === 'ok') rows = rows.filter(r => r.allOk);
  const header = ['Unidade', ...INDICATORS.map(i => i.key), 'Status'].join(';');
  const metas = ['Meta', ...INDICATORS.map(i => i.meta.toFixed(2)+'%'), ''].join(';');
  const body = rows.map(r => [r.u, ...r.vals.map(v => v !== null ? v.toFixed(2)+'%' : '—'), r.allOk ? '✅' : '⛔'].join(';')).join('\n');
  const csv = `Mês: ${currentMonth}\n${header}\n${metas}\n${body}`;
  const blob = new Blob(['\uFEFF'+csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `indicadores_${currentMonth.toLowerCase()}.csv`;
  a.click(); URL.revokeObjectURL(url);
}

// ===== RANKING =====

function getRanking(month) {
  const ranking = UNITS.map(u => {
    const val = getMonthData(u, month, 'DOAT');
    return { unidade: u, media: val !== null ? val : 0 };
  });

  ranking.sort((a,b) => b.media - a.media);
  return ranking;
}

// ===== MÊS ANTERIOR =====
function getPreviousMonth(month) {
  const idx = MONTHS.indexOf(month);
  if (idx <= 0) return null;
  return MONTHS[idx - 1];
}

// ===== RESUMO EXECUTIVO =====
function buildExecutiveSummary(month) {

  const ranking = getRanking(month);
  const worst = ranking.slice(-3).reverse().map(r => r.unidade);

  const criticos = INDICATORS.filter(ind => {
    const val = getMonthData('CAT CM', month, ind.key);
    return val !== null && val < ind.meta;
  }).map(i => i.key);

  return `
  No mês de ${month}, a operação apresenta desempenho com ${
    criticos.length > 0 ? 'necessidade de atenção' : 'estabilidade operacional'

  }.

  Unidades com maior necessidade de atuação: ${worst.join(', ')}.

  ${
    criticos.length > 0
      ? `Indicadores críticos: ${criticos.join(', ')}.`
      : 'Todos os indicadores estão dentro do esperado.'
  }
  `;
}

// ===== PAINEL EXECUTIVO =====
function buildExecutivePanel(month) {

  const val = getMonthData('CAT CM', month, 'DOAT');

  const indicador = INDICATORS.find(i => i.key === 'DOAT');
  const meta = indicador.meta;
  const red = indicador.red;

  let status = '';
  let color = '';

  if (val === null) {
    status = 'SEM DADO';
    color = '#888';
  }
  else if (val <= red) {
    status = 'CRÍTICO';
    color = '#E24B4A';
  }
  else if (val < meta) {
    status = 'ATENÇÃO';
    color = '#BA7517';
  }
  else {
    status = 'CONTROLADO';
    color = '#1D9E75';
  }

  const ranking = getRanking(month);
  const top3 = ranking.slice(0,3);
  const worst3 = ranking.slice(-3).reverse();

  const resumo = buildExecutiveSummary(month);

  document.getElementById('executivePanel').innerHTML = `
    <div style="display:flex;flex-wrap:wrap;gap:20px;">
      
      <div style="flex:1;">
        <div style="font-size:12px;color:#888;">Situação Geral</div>
        <div style="font-size:24px;font-weight:bold;color:${color}">
          ${status}
        </div>
        <div style="font-size:12px;margin-top:5px;">
          DOAT: ${val !== null ? val.toFixed(2) + '%' : '—'}
        </div>
      </div>

      <div style="flex:2;">
        <div style="font-size:12px;color:#888;">Ranking DOAT</div>
        <div>
          🏆 ${top3.map(r => r.unidade).join(', ')}<br>
          🚨 ${worst3.map(r => r.unidade).join(', ')}
        </div>
      </div>

    </div>

    <div style="
      margin-top:15px;
      background:#f7f6f2;
      padding:12px;
      border-radius:8px;
      font-size:12px;">
      <strong>Resumo executivo:</strong><br>
      ${resumo}
    </div>
  `;
}

buildHeader();
loadFromSheets();
